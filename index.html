<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marhaba Hypermarket</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Header (Clean Customer UI - No Visible Admin Button) -->
  <header class="navbar">
    <div class="logo-container">
      <img src="logo.png" alt="Marhaba Logo" class="app-logo" id="main-logo" onerror="this.style.display='none'">
      <span class="brand-name">MARHABA</span>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="cart-btn" onclick="openCartModal()"><i class="fas fa-shopping-cart"></i><span id="cart-badge">0</span></button>
      <div class="dropdown">
        <button class="icon-btn"><i class="fas fa-map-marker-alt"></i></button>
        <div class="dropdown-content">
          <a href="https://maps.app.goo.gl/7ihuQEBx5pqGcPbz5" target="_blank"><i class="fas fa-store"></i> Othukkungal Branch</a>
          <a href="https://maps.app.goo.gl/oe4WV6SbhhM6DbYZ9" target="_blank"><i class="fas fa-store"></i> Karuvarakkund Branch</a>
        </div>
      </div>
      <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
      <a href="tel:9847283286" class="call-btn"><i class="fas fa-phone-alt"></i> Call</a>
    </div>
  </header>

  <!-- Search Bar -->
  <section class="search-container">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="Search products, groceries, deals..." oninput="filterProducts()">
    </div>
  </section>

  <!-- Carousel Banner -->
  <section class="banner-slider">
    <div class="slides" id="banner-slides"></div>
    <div class="dots" id="banner-dots"></div>
  </section>

  <!-- Filter Categories -->
  <section class="filters-container">
    <button class="filter-chip active" onclick="filterCategory('All', this)">All</button>
    <button class="filter-chip" onclick="filterCategory('Vegetables', this)">Veg</button>
    <button class="filter-chip" onclick="filterCategory('Rice & Grains', this)">Rice</button>
    <button class="filter-chip" onclick="filterCategory('Beverages', this)">Bev</button>
    <button class="filter-chip" onclick="filterCategory('Snacks & Spices', this)">Snacks</button>
    <button class="filter-chip" onclick="filterCategory('Household', this)">Household</button>
  </section>

  <!-- Product Grid -->
  <main class="products-grid" id="products-grid"></main>

  <!-- Product Detail Modal -->
  <div class="modal" id="product-modal">
    <div class="modal-content product-detail-card">
      <span class="close-btn" onclick="closeProductModal()">&times;</span>
      <div class="modal-img-container">
        <img id="modal-img" src="" alt="Product Image">
      </div>
      <h2 id="modal-title">Product Name</h2>
      <p id="modal-unit" class="modal-unit"></p>
      <div class="modal-price-box">
        <span id="modal-price" class="current-price"></span>
        <span id="modal-mrp" class="mrp-price"></span>
      </div>
      <p id="modal-description" class="modal-desc"></p>
      
      <div class="quantity-controls">
        <button onclick="changeQty(-1)"><i class="fas fa-minus"></i></button>
        <span id="modal-qty">1</span>
        <button onclick="changeQty(1)"><i class="fas fa-plus"></i></button>
      </div>

      <div class="action-buttons">
        <button class="btn btn-cart" onclick="addCurrentToCart()"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        <button class="btn btn-wa" onclick="openOrderModal('single')"><i class="fab fa-whatsapp"></i> Buy via WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCartModal()">&times;</span>
      <h2>Your Shopping Cart</h2>
      <div id="cart-items-container"></div>
      <div class="cart-summary">
        Total: ₹<span id="cart-total-price">0</span>
      </div>
      <button class="btn btn-wa full-width" onclick="openOrderModal('cart')"><i class="fab fa-whatsapp"></i> Order All via WhatsApp</button>
    </div>
  </div>

  <!-- Order / Address Modal -->
  <div class="modal" id="order-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeOrderModal()">&times;</span>
      <h2>Customer Details</h2>
      <form id="order-form" onsubmit="submitWhatsAppOrder(event)">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="cust-name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="cust-phone" required placeholder="10-digit mobile number">
        </div>
        <div class="form-group">
          <label>Delivery Address *</label>
          <textarea id="cust-address" required placeholder="Enter your complete home address"></textarea>
        </div>
        <button type="submit" class="btn btn-wa full-width"><i class="fab fa-whatsapp"></i> Confirm Order & Send WhatsApp</button>
      </form>
    </div>
  </div>

  <!-- Hidden Admin Login & Dashboard Modal -->
  <div class="modal" id="admin-modal">
    <div class="modal-content admin-modal-box">
      <span class="close-btn" onclick="closeAdminModal()">&times;</span>
      
      <!-- Login Section -->
      <div id="admin-auth-container">
        <h2>Admin Panel Login</h2>
        <form onsubmit="adminLogin(event)">
          <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="admin-email" required placeholder="fhminshaikk@gmail.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="admin-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-cart full-width">Login to Dashboard</button>
        </form>
      </div>

      <!-- Logged-In Dashboard Section -->
      <div id="admin-dashboard-container" style="display:none;">
        <div class="admin-header">
          <h2>Store Control Panel</h2>
          <button class="btn btn-danger" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <!-- Tab Navigation -->
        <div class="admin-tabs">
          <button class="admin-tab-btn active" id="tab-btn-products" onclick="switchAdminTab('products')">Products</button>
          <button class="admin-tab-btn" id="tab-btn-banners" onclick="switchAdminTab('banners')">Banners</button>
        </div>

        <!-- Products Manager Tab -->
        <div id="admin-tab-products" class="admin-tab-content">
          <div class="admin-card">
            <h3 id="product-form-title">Add New Product</h3>
            <form id="product-form" onsubmit="saveProduct(event)">
              <input type="hidden" id="admin-prod-id">
              <div class="form-row">
                <div class="form-group">
                  <label>Product Name *</label>
                  <input type="text" id="admin-prod-name" required placeholder="e.g. Basmati Rice 5kg">
                </div>
                <div class="form-group">
                  <label>Category *</label>
                  <select id="admin-prod-category" required>
                    <option value="Rice & Grains">Rice & Grains</option>
                    <option value="Vegetables">Vegetables</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Snacks & Spices">Snacks & Spices</option>
                    <option value="Household">Household</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Offer Price (₹) *</label>
                  <input type="number" id="admin-prod-price" required step="0.01" placeholder="450">
                </div>
                <div class="form-group">
                  <label>MRP Price (₹)</label>
                  <input type="number" id="admin-prod-mrp" step="0.01" placeholder="520">
                </div>
                <div class="form-group">
                  <label>Unit/Weight</label>
                  <input type="text" id="admin-prod-unit" placeholder="e.g. 5 kg or 1 L">
                </div>
              </div>
              <div class="form-group">
                <label>Image URL</label>
                <input type="url" id="admin-prod-image" placeholder="https://images.unsplash.com/...">
              </div>
              <div class="form-group">
                <label>Description</label>
                <textarea id="admin-prod-desc" rows="2" placeholder="Brief details about the item"></textarea>
              </div>
              <div class="admin-form-actions">
                <button type="submit" class="btn btn-cart"><i class="fas fa-save"></i> Save Product</button>
                <button type="button" class="btn btn-secondary" onclick="resetProductForm()">Cancel / Reset</button>
              </div>
            </form>
          </div>

          <h3>Existing Catalog</h3>
          <div id="admin-products-list" class="admin-list-container"></div>
        </div>

        <!-- Banners Manager Tab -->
        <div id="admin-tab-banners" class="admin-tab-content" style="display:none;">
          <div class="admin-card">
            <h3>Add New Banner</h3>
            <form id="banner-form" onsubmit="saveBanner(event)">
              <div class="form-group">
                <label>Banner Title</label>
                <input type="text" id="admin-banner-title" required placeholder="e.g. Weekend Super Sale">
              </div>
              <div class="form-group">
                <label>Image URL *</label>
                <input type="url" id="admin-banner-image" required placeholder="https://images.unsplash.com/...">
              </div>
              <button type="submit" class="btn btn-cart"><i class="fas fa-plus"></i> Add Banner</button>
            </form>
          </div>

          <h3>Active Banners</h3>
          <div id="admin-banners-list" class="admin-list-container"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase v8 SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Application JS -->
  <script src="app.js"></script>

  <!-- Secret URL Hash Trigger Script -->
  <script>
    function checkAdminHash() {
      if (window.location.hash === '#admin') {
        const modal = document.getElementById('admin-modal');
        if (modal) modal.style.display = 'flex';
      }
    }
    window.addEventListener('DOMContentLoaded', checkAdminHash);
    window.addEventListener('load', checkAdminHash);
    window.addEventListener('hashchange', checkAdminHash);
  </script>
</body>
</html>
